# Lavalink v4 configuration.
#
# Two plugins are loaded:
#   * youtube-source — YouTube playback (the built-in source is deprecated).
#   * LavaSrc        — Spotify metadata. Spotify itself cannot be streamed, so
#                      LavaSrc resolves the link to title/artist/ISRC and then
#                      mirrors it to a playable source via `providers` below.
#                      That is LavaSrc's normal design, not a workaround.
#
# Passwords and Spotify credentials come from the environment (see
# docker-compose.yml), so nothing secret lives in this file.
server:
  port: 2333
  address: 0.0.0.0

lavalink:
  plugins:
    # YOUTUBE_PLUGIN_VERSION defaults to the 1.18.2 release. YouTube now answers
    # many requests with SABR-only data - no direct stream URL - which that
    # release cannot consume; the symptom is playback failing with
    # "No supported audio streams available, available types:" and an empty
    # list, while searching still works.
    #
    # The fix is a snapshot build from main, which carries the fixes made since
    # the release. Set in .env and recreate the node:
    #   YOUTUBE_PLUGIN_VERSION=f45bbb7aebfcbc1c553769e04af6cd43afa8b7c3
    #   YOUTUBE_PLUGIN_SNAPSHOT=true
    - dependency: "dev.lavalink.youtube:youtube-plugin:${YOUTUBE_PLUGIN_VERSION:1.18.2}"
      repository: "https://maven.lavalink.dev/${YOUTUBE_PLUGIN_REPO:releases}"
      snapshot: ${YOUTUBE_PLUGIN_SNAPSHOT:false}
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.3"
      repository: "https://maven.lavalink.dev/releases"
  server:
    password: "${LAVALINK_SERVER_PASSWORD:youshallnotpass}"
    sources:
      youtube: false      # disabled here; handled by the youtube plugin below
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: true         # plays files mounted at /music
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    trackStuckThresholdMs: 10000
    youtubePlaylistLoadLimit: 6
    playerUpdateInterval: 5
    opusEncodingQuality: 10

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    # The order the plugin queries clients in. This is the list the plugin's
    # own README recommends; every name must appear in its "Available Clients"
    # table or it is ignored. MUSIC has no playback support at all - it is here
    # for the `ytmsearch:` prefix, and the clients after it do the streaming.
    # Every client the plugin lists as having playback support, so a refusal
    # from one is not the end of the attempt. Only clients named here are
    # registered at all - an unregistered one is not a silent fallback, it
    # simply does not exist. MUSIC has no playback support and is present for
    # the `ytmsearch:` prefix.
    clients:
      - MUSIC
      # TV is the only client the plugin's table marks as OAuth-capable, so it
      # must be registered for signing in to have any effect at all - the
      # plugin warns "OAuth has been enabled without registering any
      # OAuth-compatible client" otherwise. It also unlocks age-restricted
      # videos once signed in.
      - TV
      - ANDROID_VR
      - ANDROID_MUSIC
      - IOS
      - TVHTML5_SIMPLY
      - MWEB
      - WEB
      - WEBEMBEDDED

    # Signature deciphering is no longer done inside the plugin; without a
    # cipher server YouTube playback fails while search still works. yt-cipher
    # is the server the plugin's README points to. This stack runs its own
    # (see docker-compose.yml); set YT_CIPHER_URL to https://cipher.kikkia.dev/
    # to use the author's public instance instead, or to an empty value to
    # disable the feature.
    remoteCipher:
      url: "${YT_CIPHER_URL:http://yt-cipher:8001}"
      password: "${YT_CIPHER_PASSWORD:}"
      userAgent: "astrabot"

    # Signing in is the youtube-source equivalent of the cookies.txt the old
    # yt-dlp implementation used - and the reason that one was stable. Enable
    # by setting YOUTUBE_OAUTH=true; the plugin then prints a code to enter at
    # google.com/device, and afterwards logs a refresh token to paste into
    # YOUTUBE_REFRESH_TOKEN so the flow is never repeated.
    # Use a burner account: the maintainers warn it can be terminated.
    oauth:
      enabled: ${YOUTUBE_OAUTH:false}
      refreshToken: "${YOUTUBE_REFRESH_TOKEN:}"

    # A proof-of-origin token makes WEB and WEBEMBEDDED requests look like a
    # real browser. It is the no-account alternative to signing in: nothing is
    # authorised, so there is no account to lose. The plugin's README points at
    # iv-org/youtube-trusted-session-generator, which is deprecated - its last
    # commit is literally "warning tool is deprecated". Use bgutil instead:
    #   docker run --name bgutil-provider -d --init \
    #     -p 127.0.0.1:4416:4416 brainicism/bgutil-ytdlp-pot-provider
    #   curl -s -X POST http://127.0.0.1:4416/get_pot -d '{}' \
    #     -H 'Content-Type: application/json'
    # The response's poToken and contentBinding go in the two variables below.
    # Tokens expire, so re-run it when playback starts failing again.
    pot:
      token: "${YOUTUBE_POT_TOKEN:}"
      visitorData: "${YOUTUBE_POT_VISITOR_DATA:}"

  lavasrc:
    sources:
      spotify: true
      applemusic: false
      deezer: false
      yandexmusic: false
      flowerytts: false
      youtube: false      # leave YouTube to the dedicated plugin above
      vkmusic: false
      tidal: false
      qobuz: false
      jiosaavn: false
    providers:
      # ISRC is the recording's unique id, so this finds the same master rather
      # than a cover or a live version. Falls back to a plain title search when
      # the track carries no ISRC.
      - 'ytsearch:"%ISRC%"'
      - "ytsearch:%QUERY%"
    spotify:
      # Empty when SPOTIFY_* are unset: LavaSrc then simply fails to resolve
      # Spotify links, and the bot reports that instead of "nothing found".
      clientId: "${SPOTIFY_CLIENT_ID:}"
      clientSecret: "${SPOTIFY_CLIENT_SECRET:}"
      # Affects which catalogue/relinking Spotify returns.
      countryCode: "PL"
      playlistLoadLimit: 6
      albumLoadLimit: 6
      # Keep this off: it makes an extra call to /v1/artists?ids=, which
      # Spotify answers with 403 for client-credentials apps, failing the whole
      # search. Verified against the live API — single-id lookups still work.
      resolveArtistsInSearch: false
      localFiles: false

logging:
  level:
    root: INFO
    lavalink: INFO
    # Set YOUTUBE_LOG_LEVEL=DEBUG to see per-format decisions, including
    # "missing format URL ... SABR response?" - the line that tells you
    # YouTube returned no playable URL rather than the bot misbehaving.
    dev.lavalink.youtube: "${YOUTUBE_LOG_LEVEL:INFO}"
