# Convenient self-host stack: the bot + a Lavalink audio node.
# Quick start:
#   1) cp .env.example .env   and fill in DISCORD_TOKEN / OWNER_IDS
#   2) mkdir -p data music    <- IMPORTANT, see below
#   3) docker compose up -d --build
#
# Create ./data and ./music yourself before the first start. The bot container
# runs as uid 1000 (not root); if Docker has to create these bind-mount sources
# it makes them root-owned, and the bot then dies with
# "sqlite3.OperationalError: unable to open database file".
# If your own uid is not 1000:
#   docker compose build --build-arg UID=$(id -u) --build-arg GID=$(id -g)
services:
  # Signature deciphering for the YouTube source. The youtube-source plugin no
  # longer does this itself, and without it playback fails while search keeps
  # working - which is exactly what "No supported audio streams available"
  # looks like. See https://github.com/kikkia/yt-cipher
  yt-cipher:
    image: ghcr.io/kikkia/yt-cipher:master
    restart: unless-stopped
    environment:
      # The author notes only the IAS script variant works reliably.
      - OVERRIDE_PLAYER_VARIANT=IAS
    # No healthcheck: the image is distroless - no shell, no curl, not even the
    # deno binary on PATH - so nothing can run inside it. Ordering is enforced
    # with service_started below instead.
    networks:
      - botnet
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4.2.2
    restart: unless-stopped
    # Needed so the plugins can be downloaded into ./lavalink/plugins.
    user: "root"
    environment:
      - _JAVA_OPTIONS=-Xmx512m
      - SERVER_PORT=2333
      # Read from the shell environment or ./.env. The bot reads the same value
      # via env_file below, so keep LAVALINK_PASSWORD in .env — not just exported
      # in your shell, or the two would disagree and auth would fail.
      - LAVALINK_SERVER_PASSWORD=${LAVALINK_PASSWORD:-youshallnotpass}
      # Consumed by the LavaSrc plugin (see lavalink/application.yml). Spotify
      # support is resolved here, not in the bot, so these belong to this
      # container. Unset is fine — Spotify links then simply do not resolve.
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID:-}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET:-}
      # Lets you move to a youtube-plugin snapshot without editing YAML, which
      # is how you recover when a release stops being able to fetch streams.
      - YOUTUBE_PLUGIN_VERSION=${YOUTUBE_PLUGIN_VERSION:-1.18.2}
      - YOUTUBE_PLUGIN_REPO=${YOUTUBE_PLUGIN_REPO:-releases}
      - YOUTUBE_PLUGIN_SNAPSHOT=${YOUTUBE_PLUGIN_SNAPSHOT:-false}
      # Defaults to the yt-cipher service above; point it at
      # https://cipher.kikkia.dev/ to use the public instance instead.
      - YT_CIPHER_URL=${YT_CIPHER_URL:-http://yt-cipher:8001}
      - YT_CIPHER_PASSWORD=${YT_CIPHER_PASSWORD:-}
      # DEBUG shows why a track produced no stream.
      - YOUTUBE_LOG_LEVEL=${YOUTUBE_LOG_LEVEL:-INFO}
      # Signing in is what the old yt-dlp bot did with cookies.txt.
      - YOUTUBE_OAUTH=${YOUTUBE_OAUTH:-false}
      - YOUTUBE_REFRESH_TOKEN=${YOUTUBE_REFRESH_TOKEN:-}
      # No-account alternative to signing in; see lavalink/application.yml.
      - YOUTUBE_POT_TOKEN=${YOUTUBE_POT_TOKEN:-}
      - YOUTUBE_POT_VISITOR_DATA=${YOUTUBE_POT_VISITOR_DATA:-}
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml:ro
      - ./lavalink/plugins:/opt/Lavalink/plugins
      - ./music:/music:ro
    depends_on:
      yt-cipher:
        # Without this, Lavalink can come up before the cipher server exists,
        # and every YouTube track then fails to produce a stream while the
        # stack looks perfectly healthy. That is exactly how it broke in
        # practice: the container was still only "Created" when Lavalink
        # reported itself healthy.
        condition: service_started
    healthcheck:
      # /version requires the server password ($$ escapes to a literal $ for the
      # shell); it only answers once the HTTP server is actually accepting calls.
      test: ["CMD-SHELL", "curl -fsS -H \"Authorization: $$LAVALINK_SERVER_PASSWORD\" http://localhost:2333/version || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    ports:
      # Loopback only: the bot reaches the node over the compose network,
      # so this is purely for local debugging and for the e2e test suite
      # (`venv/bin/python -m pytest -m e2e`). Not reachable from outside
      # this machine.
      - "127.0.0.1:2333:2333"
    networks:
      - botnet
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      lavalink:
        # Wait for Lavalink to actually answer, not merely to be created.
        condition: service_healthy
    volumes:
      - ./data:/app/data          # SQLite database + saved queues
      - ./music:/app/music:ro     # local audio files
    networks:
      - botnet
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  botnet:
    driver: bridge
